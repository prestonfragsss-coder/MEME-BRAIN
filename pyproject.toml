[project]
name = "hermes-launch-os"
version = "0.1.0"
description = "HERMES LAUNCH OS - multi-agent Solana token project factory (operator-approved launches only)"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=2.10,<3",
  "pydantic>=2",
  "httpx>=0.27",
  "pillow>=10",
]

[project.optional-dependencies]
local = ["playwright>=1.45"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
hermes = "hermes.cli:main"

[tool.setuptools.packages.find]
include = ["hermes*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
